name: Publicar Release dos Kits

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Montar, Compactar e Publicar Kits Universais
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Executar Testes Unitários
      run: python -m unittest discover -s tests -v

    - name: Baixar componentes
      run: python preparar.py baixar --so ambos --perfil todos

    - name: Montar kits universais
      run: python preparar.py montar --so ambos --perfil todos

    - name: Compactar kits universais (.zip)
      run: python preparar.py zip --so ambos --perfil todos

    - name: Gerar Hashes SHA-256
      run: |
        cd dist
        for z in *.zip; do
          sha256sum "$z" > "$z.sha256"
          cat "$z.sha256"
        done

    - name: Inspecionar e validar pacotes
      run: python verificar_pacote.py

    - name: Criar GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.zip
          dist/*.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
